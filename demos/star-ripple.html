<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Star Ripple</title>
<style>
  :root {
    --bg: #0d0d10;
    --panel: #17171c;
    --line: #2a2a31;
    --text: #ececf1;
    --muted: #8b8b96;
    --accent: #b28cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 24px 16px;
    min-height: 100vh;
    flex-wrap: wrap;
  }
  .phone {
    --w: 390px;
    --h: 844px;
    --scale: min(1, calc((100vh - 48px) / 868px));
    width: calc(var(--w) * var(--scale) + 24px);
    height: calc(var(--h) * var(--scale) + 24px);
    padding: 12px;
    border-radius: 64px;
    background: #1c1c20;
    box-shadow: 0 0 0 1px #2c2c33 inset, 0 40px 80px rgba(0,0,0,.55);
    flex-shrink: 0;
  }
  .screen {
    width: 100%;
    height: 100%;
    border-radius: 52px;
    overflow: hidden;
    position: relative;
    background: #000;
  }
  canvas#gl { width: 100%; height: 100%; display: block; cursor: pointer; touch-action: manipulation; }

  .panel {
    width: 300px;
    max-width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
  }
  .panel h1 { font-size: 16px; margin: 0 0 4px; font-weight: 600; }
  .panel p.hint { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  .row { margin-bottom: 14px; }
  .row label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .row label output { color: var(--text); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .inline { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; font-size: 13px; }
  input[type=color] { width: 44px; height: 28px; border: 1px solid var(--line); border-radius: 8px; background: none; padding: 2px; }
  button {
    width: 100%;
    height: 40px;
    border-radius: 12px;
    border: 0;
    background: var(--accent);
    color: #120c1d;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { transform: scale(.98); }
</style>
</head>
<body>
  <div class="phone"><div class="screen"><canvas id="gl"></canvas></div></div>

  <div class="panel">
    <h1>Star ripple</h1>
    <p class="hint">Нажми на звёздочку — волна пойдёт от неё. Клик в любом другом месте тоже запускает волну.</p>

    <div class="row"><label>Сила преломления <output id="o-strength"></output></label>
      <input id="strength" type="range" min="0" max="40" step="1" value="16"></div>
    <div class="row"><label>Ширина фронта <output id="o-width"></output></label>
      <input id="width" type="range" min="10" max="140" step="1" value="48"></div>
    <div class="row"><label>Длительность, с <output id="o-dur"></output></label>
      <input id="dur" type="range" min="0.4" max="3" step="0.05" value="1.2"></div>
    <div class="row"><label>Хроматика <output id="o-chroma"></output></label>
      <input id="chroma" type="range" min="0" max="1" step="0.01" value="0.45"></div>
    <div class="row"><label>Свечение <output id="o-glow"></output></label>
      <input id="glow" type="range" min="0" max="1.5" step="0.01" value="0.6"></div>

    <div class="inline"><span>Цвет свечения</span><input id="tint" type="color" value="#b28cff"></div>
    <div class="inline"><span>Замедление ×4</span><input id="slow" type="checkbox"></div>

    <button id="replay">Повторить от звезды</button>
  </div>

<script>
(() => {
  // ---------- UI, нарисованный в 2D-канвас (это текстура для шейдера) ----------
  const W = 390, H = 844;
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const ui = document.createElement('canvas');
  ui.width = W * DPR; ui.height = H * DPR;
  const c = ui.getContext('2d');

  const SANS = '-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
  const MONO = 'ui-monospace, "SF Mono", Menlo, monospace';
  const STAR = { x: 338, y: 748, r: 24 };
  let favorite = false;

  function starPath(cx, cy, R, r) {
    c.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const rad = i % 2 ? r : R;
      c.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
    }
    c.closePath();
  }

  function newsCard(x, title, sub1, sub2, date, g1, g2) {
    const grd = c.createLinearGradient(x, 70, x + 120, 190);
    grd.addColorStop(0, g1); grd.addColorStop(1, g2);
    c.fillStyle = grd;
    c.beginPath(); c.roundRect(x, 70, 120, 120, 22); c.fill();
    // «окна» на картинке
    c.fillStyle = 'rgba(255,255,255,.18)';
    for (let i = 0; i < 4; i++) c.fillRect(x + 18 + i * 24, 118, 14, 52);

    c.fillStyle = '#fff';
    c.font = `600 22px ${SANS}`;
    c.fillText(title, x, 236);
    c.fillStyle = '#c9c9d1';
    c.font = `13px ${MONO}`;
    c.fillText(sub1, x, 262);
    c.fillText(sub2, x, 280);
    c.fillStyle = '#e5484d';
    c.fillRect(x, 314, 6, 10);
    c.fillStyle = '#8d8d96';
    c.font = `12px ${MONO}`;
    c.fillText(date, x + 14, 324);
  }

  function drawUI() {
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.fillStyle = '#000';
    c.fillRect(0, 0, W, H);

    // статус-бар
    c.fillStyle = '#fff';
    c.font = `600 16px ${SANS}`;
    c.fillText('1:30', 40, 36);
    for (let i = 0; i < 4; i++) c.fillRect(292 + i * 5, 32 - i * 2.5, 3, 4 + i * 2.5);
    c.beginPath(); c.roundRect(320, 24, 30, 14, 4); c.fill();
    c.fillStyle = '#000'; c.font = `700 10px ${SANS}`; c.fillText('50', 328, 35);

    newsCard(24, 'Acme Inc (ACME) Q3', 'Highlights: Record Revenue', 'and Device Sales Growth', '30 JAN', '#24324d', '#6f5ea0');
    newsCard(330, 'Market', 'Nasdaq', 'week', '29 JAN', '#3d4a2c', '#8fa36a');

    // бейдж на первой карточке
    c.fillStyle = '#fff';
    c.beginPath(); c.roundRect(104, 60, 50, 28, 14); c.fill();
    c.fillStyle = '#111'; c.font = `600 13px ${SANS}`; c.fillText('♥ 5', 116, 79);

    // шторка
    c.fillStyle = '#f2f2f4';
    c.beginPath(); c.roundRect(10, 380, W - 20, H - 370, 40); c.fill();
    c.strokeStyle = '#c6c6cc'; c.lineWidth = 2; c.lineCap = 'round';
    c.beginPath(); c.moveTo(184, 398); c.quadraticCurveTo(195, 393, 206, 398); c.stroke();
    c.fillStyle = '#333';
    for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(334 + i * 6, 404, 1.6, 0, 7); c.fill(); }

    c.fillStyle = '#0b0b0d';
    c.beginPath(); c.arc(64, 452, 26, 0, 7); c.fill();
    c.fillStyle = '#fff'; c.font = `700 22px ${SANS}`; c.textAlign = 'center';
    c.fillText('A', 64, 460); c.textAlign = 'left';

    c.fillStyle = '#55555c'; c.font = `14px ${MONO}`; c.fillText('Acme Inc.', 40, 524);
    c.fillStyle = '#111'; c.font = `500 40px ${SANS}`; c.fillText('$258.07', 38, 570);
    c.fillStyle = '#2e9b4f'; c.font = `13px ${MONO}`; c.fillText('▲ $0,50 (0.8%)', 40, 596);

    // график
    const n = 72, x0 = 44, x1 = 352, yTop = 614, yBot = 712;
    c.strokeStyle = '#0b0b0d'; c.lineWidth = 3.5; c.lineJoin = 'round';
    c.beginPath();
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const v = t * 0.82 + 0.07 * Math.sin(t * 22) + 0.035 * Math.sin(t * 47 + 1.3) - (t > 0.9 ? (t - 0.9) * 2.2 : 0);
      c.lineTo(x0 + (x1 - x0) * t, yBot - (yBot - yTop) * v);
    }
    c.stroke();

    // объёмы
    c.fillStyle = '#dcdce1';
    for (let i = 0; i < 26; i++) {
      const h = 4 + 6 * (0.5 + 0.5 * Math.sin(i * 1.7)) * (i / 26);
      c.beginPath(); c.roundRect(44 + i * 10, 742 - h, 6, h, 2); c.fill();
    }

    // переключатель периода
    ['1D', '1M', '1Y', 'ALL'].forEach((label, i) => {
      const x = 40 + i * 58, active = label === '1M';
      c.fillStyle = active ? '#0b0b0d' : '#e2e2e7';
      c.beginPath(); c.roundRect(x, 772, 48, 36, 18); c.fill();
      c.fillStyle = active ? '#fff' : '#55555c';
      c.font = `13px ${MONO}`; c.textAlign = 'center';
      c.fillText(label, x + 24, 795); c.textAlign = 'left';
    });

    // звезда
    c.fillStyle = favorite ? '#0b0b0d' : '#e2e2e7';
    c.beginPath(); c.arc(STAR.x, STAR.y, STAR.r, 0, 7); c.fill();
    starPath(STAR.x, STAR.y + 1, 10, 4.4);
    c.lineWidth = 1.8;
    if (favorite) { c.strokeStyle = '#fff'; c.stroke(); }
    else { c.strokeStyle = '#111'; c.stroke(); }

    // home indicator
    c.fillStyle = '#111';
    c.beginPath(); c.roundRect(128, 828, 134, 5, 3); c.fill();
  }

  // ---------- WebGL ----------
  const canvas = document.getElementById('gl');
  canvas.width = W * DPR; canvas.height = H * DPR;
  const gl = canvas.getContext('webgl', { premultipliedAlpha: false, antialias: false });

  const VERT = `
    attribute vec2 aPos;
    varying vec2 vUv;
    void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

  const FRAG = `
    precision highp float;
    #define MAX_RIPPLES 4
    uniform sampler2D uTex;
    uniform vec2 uRes;                 // размер экрана в пикселях
    uniform vec4 uRip[MAX_RIPPLES];    // xy — центр (px, y снизу), z — время с начала (с), w — активна
    uniform float uStrength;           // макс. смещение, px
    uniform float uWidth;              // ширина фронта, px
    uniform float uDur;                // длительность, с
    uniform float uChroma;             // разнос каналов
    uniform float uGlow;
    uniform vec3 uTint;
    varying vec2 vUv;

    void main() {
      vec2 p = vUv * uRes;
      vec2 offR = vec2(0.0), offG = vec2(0.0), offB = vec2(0.0);
      float glow = 0.0, edgeGlow = 0.0, fringe = 0.0;
      float maxR = length(uRes) * 1.05;
      float edgeDist = min(min(p.x, uRes.x - p.x), min(p.y, uRes.y - p.y));
      float edgeMask = exp(-edgeDist / (uWidth * 0.45));

      for (int i = 0; i < MAX_RIPPLES; i++) {
        vec4 rp = uRip[i];
        if (rp.w < 0.5) continue;
        float t = clamp(rp.z / uDur, 0.0, 1.0);
        float e = 1.0 - pow(1.0 - t, 3.0);          // ease-out cubic
        float r = e * maxR;
        float w = uWidth * (0.7 + 0.9 * t);         // фронт расплывается по мере роста

        vec2 d = p - rp.xy;
        float dist = length(d);
        vec2 dir = dist > 0.001 ? d / dist : vec2(0.0);
        float x = (dist - r) / w;

        float ring = exp(-x * x);
        float lens = -x * ring * 2.33;              // производная гауссианы: линза тянет к фронту
        float fade = (1.0 - t) * (1.0 - t);
        float amp = uStrength * fade * smoothstep(0.0, 0.06, t);

        offR += dir * lens * amp * (1.0 + uChroma);
        offG += dir * lens * amp;
        offB += dir * lens * amp * (1.0 - uChroma);

        // шлейф за фронтом
        float behind = max(r - dist, 0.0);
        float trail = exp(-behind / (w * 4.0)) * step(dist, r);
        glow += (ring * 0.55 + trail * 0.3) * fade;
        edgeGlow += (ring + trail * 0.8) * fade;
        fringe += ring * fade;
      }

      vec2 px = 1.0 / uRes;
      vec3 col;
      col.r = texture2D(uTex, (p - offR) * px).r;
      col.g = texture2D(uTex, (p - offG) * px).g;
      col.b = texture2D(uTex, (p - offB) * px).b;

      // на тёмном — мягкий screen-блик, на светлом — лёгкая подкраска тинтом
      vec3 g = uTint * clamp(glow * uGlow + edgeGlow * edgeMask * uGlow * 1.2, 0.0, 1.0);
      col = 1.0 - (1.0 - col) * (1.0 - g * 0.85);
      float lum = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(col, col * mix(vec3(1.0), uTint, 0.6), clamp(fringe * uGlow * 0.5, 0.0, 1.0) * lum);

      gl_FragColor = vec4(col, 1.0);
    }`;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

  function uploadUI() {
    drawUI();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, ui);
  }

  const U = {};
  ['uTex', 'uRes', 'uRip', 'uStrength', 'uWidth', 'uDur', 'uChroma', 'uGlow', 'uTint']
    .forEach(n => U[n] = gl.getUniformLocation(prog, n));
  gl.uniform1i(U.uTex, 0);
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.viewport(0, 0, canvas.width, canvas.height);

  // ---------- параметры ----------
  const $ = id => document.getElementById(id);
  const params = {};
  ['strength', 'width', 'dur', 'chroma', 'glow'].forEach(id => {
    const el = $(id), out = $('o-' + id);
    const sync = () => { params[id] = parseFloat(el.value); out.textContent = el.value; };
    el.addEventListener('input', sync); sync();
  });
  const hexToRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);

  // ---------- волны ----------
  const MAX = 4;
  const ripples = []; // { x, y (css px, сверху), age }
  function spawn(x, y) {
    if (ripples.length >= MAX) ripples.shift();
    ripples.push({ x, y, age: 0 });
  }

  function toScreen(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }

  canvas.addEventListener('pointerdown', e => {
    const p = toScreen(e);
    if (Math.hypot(p.x - STAR.x, p.y - STAR.y) <= STAR.r + 8) {
      favorite = !favorite;
      uploadUI();
      spawn(STAR.x, STAR.y);
    } else {
      spawn(p.x, p.y);
    }
  });
  $('replay').addEventListener('click', () => spawn(STAR.x, STAR.y));

  // ---------- цикл ----------
  const ripData = new Float32Array(MAX * 4);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05) * ($('slow').checked ? 0.25 : 1);
    last = now;

    for (const r of ripples) r.age += dt;
    while (ripples.length && ripples[0].age > params.dur) ripples.shift();

    ripData.fill(0);
    ripples.forEach((r, i) => {
      ripData.set([r.x * DPR, (H - r.y) * DPR, r.age, 1], i * 4);
    });

    gl.uniform4fv(U.uRip, ripData);
    gl.uniform1f(U.uStrength, params.strength * DPR);
    gl.uniform1f(U.uWidth, params.width * DPR);
    gl.uniform1f(U.uDur, params.dur);
    gl.uniform1f(U.uChroma, params.chroma);
    gl.uniform1f(U.uGlow, params.glow);
    gl.uniform3fv(U.uTint, hexToRgb($('tint').value));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }

  uploadUI();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
