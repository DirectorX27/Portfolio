<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Weather Clock</title>
<!-- Тема как на сайте: тот же ключ localStorage, ставим до отрисовки -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {
      document.documentElement.dataset.theme = 'light';
    }
  })();
</script>
<style>
  @font-face { font-family: 'Geist Mono'; src: url('../src/assets/fonts/GeistMono-Light.otf') format('opentype'); font-weight: 300; }
  @font-face { font-family: 'Matrix Sans Print'; src: url('../src/assets/fonts/MatrixSans-Print.otf') format('opentype'); }
  @font-face { font-family: 'Inter Display'; src: url('../src/assets/fonts/InterDisplay-Regular.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Inter'; src: url('../src/assets/fonts/InterVariable.ttf') format('truetype'); font-weight: 100 900; }

  /* Токены портфолио (src/styles/tokens.css) */
  :root {
    --surfacebackground: #fdfcfa;
    --surfaceneutral: #f7f5eb;
    --surfaceneutral-hover: #ebe8db;
    --surfaceclock: #262521;
    --textprimary: #262521;
    --textsecondary: #666256;
    --textuniversalwhite: #fdfcf8;
    --border-divider: #e5e4dc;
    --icon-muted: #c0bba7;
    color-scheme: light;
  }
  :root[data-theme='dark'] {
    --surfacebackground: #0d0d0d;
    --surfaceneutral: #181715;
    --surfaceneutral-hover: #252422;
    --surfaceclock: #181715;
    --textprimary: #fdfcfa;
    --textsecondary: #969288;
    --border-divider: #272725;
    --icon-muted: #5f5b53;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--surfacebackground);
    color: var(--textprimary);
    font: 15px/20px 'Inter', system-ui, sans-serif;
    letter-spacing: -0.2px;
    -webkit-font-smoothing: antialiased;
    transition: background-color 200ms ease, color 200ms ease;
  }
  button { font: inherit; letter-spacing: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 32px; }
  h1 { font-size: 15px; font-weight: 500; margin: 0; }
  h2 { font-size: 15px; font-weight: 500; margin: 0 0 16px; }
  .lead { color: var(--textsecondary); margin: 4px 0 0; max-width: 560px; font-size: 14px; }

  /* Переключатель темы как в ThemeToggle: 32×32, иконка 20 */
  .theme {
    display: grid; place-items: center; flex-shrink: 0;
    width: 32px; height: 32px; border-radius: 32px;
    background: var(--surfaceneutral);
    transition: transform .1s ease;
  }
  .theme:active { transform: scale(.96); }
  .theme svg { width: 20px; height: 20px; fill: var(--icon-muted); overflow: visible; }
  .theme svg g { transform-box: fill-box; transform-origin: center; transition: transform .4s cubic-bezier(.175,.885,.32,1.275), opacity .3s ease; }
  :root[data-theme='dark'] .theme .moon, :root:not([data-theme='dark']) .theme .sun { opacity: 0; transform: rotate(90deg) scale(.5); }

  .hero { display: grid; grid-template-columns: 1fr 320px; gap: 24px; margin-bottom: 48px; }
  .stage { display: flex; flex-direction: column; justify-content: center; gap: 40px; min-height: 380px; }
  .stage-row { display: flex; align-items: flex-end; gap: 48px; flex-wrap: wrap; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .stage figure { align-items: flex-start; }
  figcaption { font-size: 12px; color: var(--textsecondary); text-align: center; line-height: 16px; }

  /* wrapper-avatar с сайта: аватар + часы, gap 4 */
  .media { display: flex; gap: 4px; }
  .avatar { width: 148px; height: 148px; border-radius: 20px; object-fit: cover; background: var(--surfaceneutral); display: block; }

  /* Часы: геометрия как в Clock.module.css, --k масштабирует всё разом */
  .clock {
    --k: 1;
    position: relative; isolation: isolate; overflow: hidden; flex-shrink: 0;
    width: calc(148px * var(--k)); height: calc(148px * var(--k));
    border-radius: 999px;
    background: var(--surfaceclock);
    color: var(--textuniversalwhite);
  }
  .clock canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; display: block; }
  .face {
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: calc(16px * var(--k)) calc(40px * var(--k));
    text-shadow: 0 0 calc(10px * var(--k)) rgba(0, 0, 0, .22);
  }
  .label {
    align-self: stretch; text-align: center;
    font-family: 'Matrix Sans Print', system-ui, sans-serif;
    font-size: calc(11px * var(--k)); line-height: 100%; letter-spacing: .1em;
  }
  .time {
    display: flex; flex-direction: column; align-items: center; align-self: stretch;
    font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 300;
    font-size: calc(40px * var(--k)); line-height: 94%; letter-spacing: 0;
    font-variant-numeric: tabular-nums;
  }

  .panel {
    background: var(--surfaceneutral); border-radius: 20px; padding: 20px;
    display: flex; flex-direction: column; gap: 20px; font-size: 14px;
  }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field-title { font-size: 12px; color: var(--textsecondary); line-height: 16px; display: flex; justify-content: space-between; }
  .seg, .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button, .chips button {
    font-size: 13px; color: var(--textprimary);
    background: var(--surfacebackground); border: 0.8px solid var(--border-divider);
    border-radius: 999px; padding: 4px 12px;
  }
  .seg button:hover, .chips button:hover { background: var(--surfaceneutral-hover); }
  .seg button[aria-pressed='true'], .chips button[aria-pressed='true'] {
    background: var(--textprimary); color: var(--surfacebackground); border-color: transparent;
  }
  .manual { display: flex; flex-direction: column; gap: 20px; }
  .manual[aria-disabled='true'] { opacity: .4; pointer-events: none; }
  input[type='range'] { width: 100%; accent-color: var(--textprimary); }
  .check { display: flex; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; }
  .readout {
    font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 300; font-size: 12px; line-height: 18px;
    color: var(--textsecondary); border-top: 0.8px solid var(--border-divider); padding-top: 16px; white-space: pre-line;
  }

  .strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 32px 16px; justify-items: center; }

  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; }
    .stage { min-height: 0; }
  }
  @media (max-width: 400px) {
    .media { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; }
    .media > * { width: auto !important; height: auto !important; aspect-ratio: 1; }
  }
</style>
</head>

  <header>

      <h1>Weather clock</h1>
      <p class="lead">Небо внутри часов: цвет зависит от высоты солнца над Москвой, облака, туман и осадки берутся из Open-Meteo.</p>
    </div>

        <g class="moon"><path transform="translate(0 -1.5)" d="M10.94 9.074a5.115 5.115 0 0 1-9.815-2.82 5.14 5.14 0 0 1 3.315-3.685 0.885 0.885 0 0 1 0.5-0.035 0.9 0.9 0 0 1 0.445 0.224 0.905 0.905 0 0 1 0.24 0.92 3.5 3.5 0 0 0-0.04 2.105 3.135 3.135 0 0 0 2.15 2.155 3.45 3.45 0 0 0 2.1-0.04 0.915 0.915 0 0 1 0.5 0 0.9 0.9 0 0 1 0.65 0.696 0.9 0.9 0 0 1-0.045 0.48"/></g>
        <g class="sun"><path transform="translate(0 -6)" d="M8.945 12a2.97 2.97 0 0 1-1.84 2.749 2.985 2.985 0 0 1-3.248-0.647A2.974 2.974 0 0 1 5.971 9.025a2.98 2.98 0 0 1 2.105 0.872A2.97 2.97 0 0 1 8.945 12M1.601 12.524H1.025A0.525 0.525 0 0 1 0.5 12a0.523 0.523 0 0 1 0.525-0.524h0.577A0.525 0.525 0 0 1 2.127 12a0.523 0.523 0 0 1-0.525 0.524m9.373 0h-0.571A0.525 0.525 0 0 1 9.879 12a0.523 0.523 0 0 1 0.525-0.524h0.572A0.525 0.525 0 0 1 11.5 12a0.523 0.523 0 0 1-0.525 0.524m-4.982-4.4a0.525 0.525 0 0 1-0.525-0.524V7.024A0.523 0.523 0 0 1 5.993 6.5a0.525 0.525 0 0 1 0.524 0.524V7.6a0.523 0.523 0 0 1-0.525 0.524m0 9.376a0.525 0.525 0 0 1-0.525-0.523V16.4a0.523 0.523 0 0 1 0.525-0.524 0.525 0.525 0 0 1 0.525 0.524v0.576A0.523 0.523 0 0 1 5.992 17.5M2.877 9.412a0.525 0.525 0 0 1-0.373-0.157l-0.409-0.403a0.525 0.525 0 0 1 0.372-0.898c0.14 0 0.274 0.056 0.373 0.154l0.409 0.408a0.523 0.523 0 0 1 0 0.739 0.525 0.525 0 0 1-0.372 0.157m6.635 6.611a0.525 0.525 0 0 1-0.367-0.152l-0.409-0.409a0.523 0.523 0 0 1 0.57-0.869q0.098 0.048 0.17 0.131l0.409 0.408a0.523 0.523 0 0 1 0 0.739 0.525 0.525 0 0 1-0.373 0.152m-0.404-6.611a0.525 0.525 0 0 1-0.517-0.627c0.02-0.102 0.071-0.196 0.145-0.269l0.409-0.408a0.525 0.525 0 0 1 0.74 0.744l-0.41 0.403a0.525 0.525 0 0 1-0.367 0.157M2.467 16.023a0.525 0.525 0 0 1-0.372-0.152 0.523 0.523 0 0 1-0.001-0.739l0.41-0.408a0.525 0.525 0 0 1 0.745 0 0.523 0.523 0 0 1 0 0.738l-0.409 0.409a0.525 0.525 0 0 1-0.373 0.152"/></g>
      </svg>

  <section class="hero">
    <div class="stage">
      <figure>

<script>
// ---------- Тема ----------
document.getElementById('themeBtn').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('theme', next); } catch (e) { /* без сохранения */ }
});

// ---------- Константы ----------
const LAT = 55.7558, LON = 37.6173;
const MSK_OFFSET = 3; // Москва живёт в UTC+3 без перехода на летнее время

// Сцены: доли облачности и осадков 0..1. Между ними рендер плавно перетекает.
const SCENES = {
  clear:   { label: 'Ясно',     clouds: 0,    rain: 0,    snow: 0, thunder: 0, fog: 0, temp: 18 },
  partly:  { label: 'Облачно',  clouds: 0.45, rain: 0,    snow: 0, thunder: 0, fog: 0, temp: 14 },
  cloudy:  { label: 'Пасмурно', clouds: 1,    rain: 0,    snow: 0, thunder: 0, fog: 0, temp: 9 },
  fog:     { label: 'Туман',    clouds: 0.35, rain: 0,    snow: 0, thunder: 0, fog: 1, temp: 6 },
  drizzle: { label: 'Морось',   clouds: 0.85, rain: 0.35, snow: 0, thunder: 0, fog: 0, temp: 8 },
  rain:    { label: 'Дождь',    clouds: 1,    rain: 1,    snow: 0, thunder: 0, fog: 0, temp: 11 },
  thunder: { label: 'Гроза',    clouds: 1,    rain: 1,    snow: 0, thunder: 1, fog: 0, temp: 21 },
  snow:    { label: 'Снег',     clouds: 0.85, rain: 0,    snow: 1, thunder: 0, fog: 0, temp: -4 },
};
const KEYS = ['clouds', 'rain', 'snow', 'thunder', 'fog'];

// Коды WMO → сцена. cloud_cover уточняет облачность для ясной/облачной погоды.
function sceneFromWMO(code, cloudCover) {
  let key = 'clear';
  if (code === 0) key = 'clear';
  else if (code <= 2) key = 'partly';
  else if (code === 3) key = 'cloudy';
  else if (code === 45 || code === 48) key = 'fog';
  else if (code >= 51 && code <= 57) key = 'drizzle';
  else if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) key = 'rain';
  else if ((code >= 71 && code <= 77) || code === 85 || code === 86) key = 'snow';
  else if (code >= 95) key = 'thunder';
  const s = { ...SCENES[key], key };
  if (key === 'clear' || key === 'partly' || key === 'cloudy') s.clouds = Math.min(1, cloudCover / 100);
  return s;
}

// ---------- Солнце (упрощённая формула, точности в доли градуса хватает) ----------
function sun(date) {
  const r = Math.PI / 180;
  const d = date.getTime() / 86400000 - 10957.5; // дни от J2000
  const g = (357.529 + 0.98560028 * d) * r;
  const q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * r;
  const e = (23.439 - 0.00000036 * d) * r;
  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L));
  const dec = Math.asin(Math.sin(e) * Math.sin(L));
  const gmst = ((18.697374558 + 24.06570982441908 * d) % 24 + 24) % 24;
  const H = gmst * 15 * r + LON * r - ra; // часовой угол: < 0 утро, > 0 вечер
  const phi = LAT * r;
  const alt = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
  return { alt: alt / r, x: Math.sin(H) };
}

// Фаза луны 0..1 от опорного новолуния 6 января 2000, синодический месяц 29.53 дня
function moonPhase(date) {
  const days = (date.getTime() - Date.UTC(2000, 0, 6, 18, 14)) / 86400000;
  return (((days / 29.530588853) % 1) + 1) % 1;
}
function moonName(p) {
  if (p < 0.03 || p > 0.97) return 'Новолуние';
  if (p < 0.22) return 'Растущий серп';
  if (p < 0.28) return 'Первая четверть';
  if (p < 0.47) return 'Растущая';
  if (p < 0.53) return 'Полнолуние';
  if (p < 0.72) return 'Убывающая';
  if (p < 0.78) return 'Последняя четверть';
  return 'Убывающий серп';
}

function mskDate(hour) {
  const now = new Date(Date.now() + MSK_OFFSET * 3600e3);
  const h = Math.floor(hour), m = Math.round((hour - h) * 60);
  return new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), h - MSK_OFFSET, m));
}
function mskNowHour() {
  const n = new Date(Date.now() + MSK_OFFSET * 3600e3);
  return n.getUTCHours() + n.getUTCMinutes() / 60;
}
// Час сегодня, когда солнце на заданной высоте (утром или вечером)
function hourAtAltitude(target, evening) {
  let best = 12, err = 1e9;
  for (let h = evening ? 12 : 0; h < (evening ? 24 : 12); h += 0.05) {
    const d = Math.abs(sun(mskDate(h)).alt - target);
    if (d < err) { err = d; best = h; }
  }
  return best;
}
const fmtHour = (h) => {
  const hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
  return [String(hh).padStart(2, '0'), String(mm).padStart(2, '0')];
};
const fmtTemp = (v) => {
  if (v == null) return '—°C';
  const r = Math.round(v);
  return `${r < 0 ? '−' : ''}${Math.abs(r)}°C`;
};

// ---------- Цвета ----------
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
// [высота солнца, верх неба, низ неба]
const SKY = [
  // Ночь — глубокий синий, а не чёрный: иначе круг сливается с тёмной темой
  [-18, '#0c1530', '#1a2645'],
  [-10, '#111c40', '#26335c'],
  [-4,  '#1a2a5e', '#a5607c'],
  [0,   '#33508e', '#ee9466'],
  [5,   '#4a76bf', '#f4c18c'],
  [14,  '#3e7fd5', '#a8ccee'],
  [40,  '#2a6ed5', '#8cc2f2'],
].map(([a, t, b]) => [a, hex(t), hex(b)]);

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const mix = (c1, c2, k) => [lerp(c1[0], c2[0], k), lerp(c1[1], c2[1], k), lerp(c1[2], c2[2], k)];
const shade = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const lum = (c) => (0.3 * c[0] + 0.59 * c[1] + 0.11 * c[2]) / 255;
const desat = (c, k) => { const l = lum(c) * 255; return mix(c, [l, l, l], k); };
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const unit = (c) => c.map((v) => clamp(v / 255));

function skyAt(alt) {
  if (alt <= SKY[0][0]) return [SKY[0][1], SKY[0][2]];
  for (let i = 1; i < SKY.length; i++) {
    if (alt <= SKY[i][0]) {
      const k = (alt - SKY[i - 1][0]) / (SKY[i][0] - SKY[i - 1][0]);
      return [mix(SKY[i - 1][1], SKY[i][1], k), mix(SKY[i - 1][2], SKY[i][2], k)];
    }
  }
  const l = SKY[SKY.length - 1];
  return [l[1], l[2]];
}

// ---------- Шейдер неба ----------
// Один общий WebGL-контекст рисует небо каждого круга по очереди, результат копируется
// в его 2D-канвас. Так не упираемся в лимит контекстов браузера (~16).
const FRAG = `
precision highp float;
uniform vec2 uRes;
uniform float uTime, uSeed;
uniform vec3 uTop, uBot, uWarm, uCloudCol, uFogCol;
uniform vec2 uSun;
uniform float uSunA, uSunDisc, uStarA, uClouds, uFog, uFlash, uScrim, uDrift, uFogDrift, uCity, uMoonPhase;
const vec3 CITY = vec3(1.0, 0.7, 0.48); // натриевые фонари: рыжая засветка снизу

float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 6; i++) { v += a * noise(p); p = m * p + 3.1; a *= 0.5; }
  return v;
}

void main() {
  vec2 frag = gl_FragCoord.xy;
  vec2 uv = vec2(frag.x / uRes.x, 1.0 - frag.y / uRes.y);
  vec3 col = mix(uTop, uBot, smoothstep(0.0, 1.0, uv.y));
  // Засветка города у горизонта
  col += CITY * uCity * (0.22 * exp(-(1.0 - uv.y) * 4.5) + 0.03);

  // Звёзды: случайная точка в ячейке сетки, мерцают
  vec2 sp = uv * 34.0;
  vec2 cell = floor(sp);
  float h = hash(cell + uSeed);
  if (h > 0.9) {
    vec2 o = vec2(hash(cell + 1.7), hash(cell + 3.1)) - 0.5;
    float d = length(fract(sp) - 0.5 - o * 0.6) * uRes.x / 34.0; // в пикселях
    float tw = 0.5 + 0.5 * sin(uTime * (1.0 + h * 2.0) + h * 60.0);
    col += smoothstep(1.4, 0.0, d) * uStarA * tw * (h - 0.9) * 10.0;
  }

  // Луна с фазой: 0 новолуние, 0.25 первая четверть, 0.5 полнолуние, 0.75 последняя четверть.
  // В северном полушарии растущая луна освещена справа.
  vec2 mo = (uv - vec2(0.7, 0.27)) / 0.05; // локальные координаты, радиус 1
  float mr = length(mo);
  float litFrac = 0.5 - 0.5 * cos(6.2832 * uMoonPhase);
  col += vec3(0.9, 0.9, 0.85) * uStarA * 0.24 * litFrac * exp(-mr * 0.5);
  float k = cos(6.2832 * uMoonPhase);
  float edge = k * sqrt(max(0.0, 1.0 - mo.y * mo.y)); // линия терминатора
  float moonLit = uMoonPhase < 0.5
    ? smoothstep(edge - 0.1, edge + 0.1, mo.x)
    : 1.0 - smoothstep(-edge - 0.1, -edge + 0.1, mo.x);
  float maria = 0.86 + 0.14 * noise(mo * 2.2 + 4.0); // «моря» на диске
  vec3 earthshine = col + vec3(0.03, 0.035, 0.05);   // тёмная часть чуть светлее неба
  vec3 moon = mix(earthshine, vec3(0.96, 0.95, 0.89) * maria, moonLit);
  col = mix(col, moon, smoothstep(1.0, 0.86, mr) * uStarA);

  // Солнце: широкий ореол + диск
  float sd = length(uv - uSun);
  col += uWarm * uSunA * (0.45 * exp(-sd * 6.0) + 0.22 * exp(-sd * 1.8));
  col = mix(col, vec3(1.0, 0.98, 0.93), smoothstep(0.05, 0.042, sd) * uSunDisc);

  // Облака: fbm с искажением координат, растянуты по горизонтали
  vec2 p = vec2(uv.x * 1.7 + uDrift, uv.y * 2.8) + uSeed * 7.0;
  vec2 q = vec2(fbm(p + uTime * 0.012), fbm(p + vec2(5.2, 1.3) - uTime * 0.009));
  vec2 wp = p + 0.9 * q;
  float d = fbm(wp);
  float th = mix(0.74, 0.22, uClouds);
  float dens = smoothstep(th, th + 0.26, d) * smoothstep(0.0, 0.05, uClouds);
  // Свет: сравниваем плотность с точкой чуть ближе к солнцу — освещённая кромка светлее
  vec2 toSun = normalize(uSun - uv + 1e-4) * 0.05;
  float dl = fbm(wp + vec2(toSun.x * 1.7, toSun.y * 2.8));
  // В сплошной облачности рельеф мягче, иначе небо похоже на мрамор
  float lit = clamp(0.55 + (d - dl) * mix(5.0, 2.5, uClouds), 0.0, 1.0);
  vec3 cc = uCloudCol * mix(mix(0.62, 0.78, uClouds), 1.04, lit) * mix(1.0, 0.82, smoothstep(0.4, 1.0, dens) * uv.y);
  cc += uWarm * uSunA * pow(lit, 3.0) * 0.3 * (1.0 - dens * 0.5);
  cc += CITY * uCity * (0.04 + 0.11 * uv.y); // ночью облака подсвечены городом снизу
  col = mix(col, cc, dens * 0.96);
  col = mix(col, uCloudCol * 0.8, smoothstep(0.55, 1.0, uClouds) * 0.4 * (1.0 - dens * 0.5));

  // Туман: мягкие клочья, гуще у низа
  float fn = fbm(vec2(uv.x * 2.2 + uFogDrift, uv.y * 5.0 - uTime * 0.015) + uSeed * 3.0);
  float fn2 = fbm(vec2(uv.x * 1.2 - uFogDrift * 0.6, uv.y * 3.0) + uSeed * 5.0 + 11.0);
  float band = smoothstep(0.05, 0.9, uv.y);
  float fogA = uFog * clamp((fn * 0.7 + fn2 * 0.6 - 0.35) * 1.6 * band + band * 0.3, 0.0, 0.88);
  col = mix(col, uFogCol + CITY * uCity * 0.12, fogA);

  // Вспышка молнии сверху вниз
  col += vec3(0.88, 0.9, 1.0) * uFlash * mix(0.75, 0.2, uv.y);

  // Читаемость: притемнение и виньетка
  col *= 1.0 - uScrim;
  col *= 1.0 - smoothstep(0.3, 0.52, length(uv - 0.5)) * 0.22;

  gl_FragColor = vec4(col, 1.0);
}`;

const GL = (() => {
  const canvas = document.createElement('canvas');
  const max = Math.ceil(296 * clamp(window.devicePixelRatio || 1, 2, 3));
  canvas.width = canvas.height = max;
  const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
  if (!gl) return null;
  const sh = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}'));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const loc = {};
  const n = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const u = gl.getActiveUniform(prog, i); loc[u.name] = gl.getUniformLocation(prog, u.name); }
  return {
    canvas,
    // Рисует небо размером px×px в левый нижний угол общего канваса
    render(px, u) {
      gl.viewport(0, 0, px, px);
      gl.uniform2f(loc.uRes, px, px);
      for (const [k, v] of Object.entries(u)) {
        if (!loc[k]) continue;
        if (typeof v === 'number') gl.uniform1f(loc[k], v);
        else if (v.length === 2) gl.uniform2fv(loc[k], v);
        else gl.uniform3fv(loc[k], v);
      }
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      return canvas.height - px; // y источника для drawImage
    },
  };
})();

// ---------- Рендер одного круга ----------
const rnd = (a, b) => a + Math.random() * (b - a);

// Спрайты снежинок: плотное ядро и мягкий край. soft — для ближних, «вне фокуса».
function flakeSprite(core, color) {
  const c = document.createElement('canvas');
  c.width = c.height = 32;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(16, 16, 0, 16, 16, 16);
  g.addColorStop(0, rgba(color, 1));
  g.addColorStop(core, rgba(color, 0.85));
  g.addColorStop(1, rgba(color, 0));
  x.fillStyle = g;
  x.fillRect(0, 0, 32, 32);
  return c;
}
const FLAKE = {
  sharp: { day: flakeSprite(0.4, [255, 255, 255]), night: flakeSprite(0.4, [215, 225, 245]) },
  soft: { day: flakeSprite(0.12, [255, 255, 255]), night: flakeSprite(0.12, [215, 225, 245]) },
};

class Sky {
  constructor(canvas) {
    this.c = canvas;
    this.ctx = canvas.getContext('2d');
    this.cur = { ...SCENES.clear, wind: 0.3, alt: 30, sunX: 0 };
    this.target = { ...this.cur };
    this.visible = true;
    this.seed = rnd(0, 10);
    this.drift = 0;
    this.fogDrift = 0;
    this.flashT = 9;
    this.nextFlash = rnd(1, 3);
    this.drops = Array.from({ length: 150 }, () => ({ x: rnd(-0.2, 1.2), y: Math.random(), l: rnd(0.028, 0.055), v: rnd(1.4, 2.2) }));
    // Снег в глубину: z = 0 далеко (мелкие, медленные, тусклые), z = 1 близко (крупнее, быстрее, мягче).
    // Дальних больше, как в реальном снегопаде. Сортируем, чтобы ближние рисовались поверх.
    this.flakes = Array.from({ length: 130 }, () => {
      const z = Math.random() ** 1.8;
      return {
        z, x: Math.random(), y: Math.random(), ph: rnd(0, 6.28),
        r: lerp(0.0022, 0.011, z) * rnd(0.8, 1.2),
        v: lerp(0.03, 0.13, z) * rnd(0.85, 1.15),
        a: lerp(0.3, 0.95, z) * rnd(0.65, 1),
        sway: lerp(0.008, 0.035, z), freq: rnd(0.6, 1.6),
      };
    }).sort((p, q) => p.z - q.z);
    this.glass = false; // капли на стекле поверх неба
    this.glassDrops = [];
    this.spawnAcc = 0;
    this.moonPhase = null; // null — по сегодняшней дате
    this.resize();
  }

  resize() {
    this.S = this.c.getBoundingClientRect().width;
    const dpr = clamp(window.devicePixelRatio || 1, 2, 3);
    this.px = Math.round(this.S * dpr);
    this.c.width = this.c.height = this.px;
    this.ctx.setTransform(this.px / this.S, 0, 0, this.px / this.S, 0, 0);
  }

  set(target, instant) {
    Object.assign(this.target, target);
    if (instant) Object.assign(this.cur, this.target);
  }

  step(dt) {
    const k = 1 - Math.exp(-dt * 2.5);
    for (const key of [...KEYS, 'wind', 'alt', 'sunX']) this.cur[key] = lerp(this.cur[key], this.target[key], k);
  }

  draw(t, dt) {
    const { ctx, S, cur } = this;
    const day = smooth(-8, 6, cur.alt);
    const night = 1 - smooth(-14, -4, cur.alt);
    const golden = smooth(-6, 0, cur.alt) * (1 - smooth(4, 16, cur.alt));

    // Небо: градиент по высоте солнца, облачность обесцвечивает, осадки затемняют
    let [top, bot] = skyAt(cur.alt);
    const grey = clamp(cur.clouds * 0.8 + cur.fog * 0.4);
    const dark = 1 - cur.rain * 0.32 - cur.thunder * 0.12;
    top = shade(desat(top, grey * 0.8), dark);
    bot = shade(desat(bot, grey * 0.7), dark);

    // Гроза: двойная вспышка раз в несколько секунд
    if (cur.thunder > 0.5 && dt > 0) {
      this.nextFlash -= dt;
      if (this.nextFlash <= 0) { this.flashT = 0; this.nextFlash = rnd(3, 8); }
    }
    this.flashT += dt;
    const flash = cur.thunder * (Math.max(0, 1 - this.flashT / 0.12) + 0.7 * Math.max(0, 1 - Math.abs(this.flashT - 0.24) / 0.09));

    // Своё время, чтобы с выключенной анимацией облака тоже замирали
    this.time = (this.time || this.seed * 100) + dt;
    this.drift += (0.006 + cur.wind * 0.04) * dt;
    this.fogDrift += (0.015 + cur.wind * 0.03) * dt;

    const cloudCol = shade(mix([255, 255, 255], [255, 200, 170], golden * 0.6), lerp(0.2, 0.97, day) * (1 - cur.rain * 0.35));
    const l = (lum(top) + lum(bot)) / 2;
    const u = {
      uTime: this.time, uSeed: this.seed,
      uTop: unit(top), uBot: unit(bot),
      uSun: [0.5 + 0.4 * cur.sunX, clamp(0.92 - cur.alt / 45, 0.12, 1.05)],
      uSunA: smooth(-6, 2, cur.alt) * (1 - cur.clouds * 0.8),
      uSunDisc: smooth(-1, 1, cur.alt) * (1 - cur.clouds * 0.9),
      uWarm: unit(mix([255, 246, 225], [255, 160, 90], golden)),
      uStarA: night * (1 - cur.clouds) ** 2 * (1 - cur.fog * 0.85),
      uClouds: cur.clouds,
      uCloudCol: unit(cloudCol),
      uFog: cur.fog,
      uFogCol: unit(mix(bot, [235, 235, 232], 0.3 * day + 0.12)),
      uFlash: flash * 0.8,
      uScrim: 0.05 + clamp((l - 0.35) * 0.45, 0, 0.22),
      uDrift: this.drift, uFogDrift: this.fogDrift,
      uMoonPhase: this.moonPhase ?? moonPhase(new Date()),
      // Облака и туман отражают свет города, поэтому в пасмурную ночь засветка сильнее
      uCity: (1 - smooth(-10, -2, cur.alt)) * (0.7 + 0.5 * Math.max(cur.clouds, cur.fog)),
    };

    let sy = -1;
    if (GL) {
      sy = GL.render(this.px, u);
      ctx.drawImage(GL.canvas, 0, sy, this.px, this.px, 0, 0, S, S);
    } else {
      const g = ctx.createLinearGradient(0, 0, 0, S);
      g.addColorStop(0, rgba(top, 1)); g.addColorStop(1, rgba(bot, 1));
      ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
    }

    // Дождь: тонкие косые штрихи, наклон от ветра
    if (cur.rain > 0.01) {
      const slant = 0.08 + cur.wind * 0.35;
      const n = Math.round(this.drops.length * cur.rain);
      ctx.strokeStyle = rgba(mix([200, 215, 240], [255, 255, 255], day), 0.38 * Math.min(1, cur.rain * 1.5));
      ctx.lineWidth = Math.max(0.5, S / 280);
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const d = this.drops[i];
        d.y += d.v * dt; d.x += d.v * slant * dt;
        if (d.y - d.l > 1) { d.y = -rnd(0, 0.2); d.x = rnd(-0.3, 1.1); }
        ctx.moveTo(d.x * S, d.y * S);
        ctx.lineTo((d.x - d.l * slant) * S, (d.y - d.l) * S);
      }
      ctx.stroke();
    }

    // Снег: хлопья с мягким краем, ближние размыты сильнее (как вне фокуса).
    // Ночью снег чуть тусклее и голубее — он подсвечен небом, а не солнцем.
    if (cur.snow > 0.01) {
      const visible = Math.min(1, cur.snow * 1.5) * lerp(0.7, 1, day);
      const sprites = [FLAKE.sharp, FLAKE.soft];
      for (const p of this.flakes) {
        // Плотность сцены убирает частицы равномерно по глубине, а не только ближние
        if (p.ph / 6.28 > cur.snow) continue;
        p.y += p.v * dt;
        p.x += (Math.cos(t * p.freq + p.ph) * p.sway + cur.wind * lerp(0.03, 0.1, p.z)) * dt;
        if (p.y - p.r > 1) { p.y = -p.r * 2; p.x = Math.random(); }
        if (p.x > 1.05) p.x -= 1.1;
        const r = Math.max(0.6, p.r * S);
        const sprite = sprites[p.z > 0.7 ? 1 : 0];
        const size = r * (p.z > 0.7 ? 3.2 : 2.4);
        ctx.globalAlpha = p.a * visible * (p.z > 0.7 ? 0.75 : 1);
        ctx.drawImage(night > 0.5 ? sprite.night : sprite.day, p.x * S - size / 2, p.y * S - size / 2, size, size);
      }
      ctx.globalAlpha = 1;
    }

    if (this.glass) this.drawGlass(dt, sy, day);
  }

  // Заполнить стекло каплями сразу, без ожидания (для превью)
  prefillGlass(n) {
    for (let i = 0; i < n; i++) this.spawnDrop(true);
  }

  spawnDrop(grown) {
    const r = rnd(0.008, 0.032);
    this.glassDrops.push({
      x: rnd(0.06, 0.94), y: rnd(0.04, 0.9), r,
      grow: grown ? 1 : 0, life: 1, vy: 0,
      // Крупные иногда срываются и съезжают вниз
      slide: r > 0.022 && Math.random() < 0.45, wait: rnd(0.5, 6), trail: 0,
    });
  }

  // Капли на стекле: каждая — маленькая линза, в ней перевёрнутое и уменьшенное небо вокруг,
  // тёмный ободок снизу и блик сверху. Без дождя медленно высыхают.
  drawGlass(dt, sy, day) {
    const { ctx, S, cur } = this;
    const k = this.px / S;
    this.spawnAcc += dt * cur.rain * 7;
    while (this.spawnAcc > 1) {
      this.spawnAcc -= 1;
      if (this.glassDrops.length < 45) this.spawnDrop(false);
    }

    const next = [];
    for (const d of this.glassDrops) {
      d.grow = Math.min(1, d.grow + dt * 5);
      if (cur.rain < 0.05) d.life -= dt * 0.04;
      if (d.slide && (d.wait -= dt) < 0) {
        d.vy = lerp(d.vy, 0.09 + d.r * 2, Math.min(1, dt * 1.5));
        d.y += d.vy * dt;
        d.x += Math.sin(d.y * 35 + d.r * 300) * 0.02 * dt; // путь чуть виляет
        d.trail += d.vy * dt;
        // По дороге оставляет мелкие капельки
        if (d.trail > 0.035 && this.glassDrops.length + next.length < 70) {
          d.trail = 0;
          next.push({ x: d.x + rnd(-0.004, 0.004), y: d.y - d.r * 1.4, r: d.r * rnd(0.22, 0.35), grow: 1, life: d.life, vy: 0, slide: false, wait: 0, trail: 0 });
        }
      }
      if (d.y - d.r < 1.02 && d.life > 0) next.push(d);
    }
    this.glassDrops = next;

    for (const d of this.glassDrops) {
      const R = d.r * S * d.grow;
      if (R < 0.4) continue;
      const x = d.x * S, y = d.y * S;
      const a = clamp(d.life * 1.5);
      // Падающая капля вытягивается
      const ry = R * (1.06 + Math.min(0.35, d.vy * 4));

      ctx.save();
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.ellipse(x, y, R, ry, 0, 0, 6.283);
      ctx.clip();
      if (sy >= 0) {
        // Преломление: участок неба в 5 раз шире капли, перевёрнутый
        const src = R * 5 * k;
        ctx.translate(x, y);
        ctx.scale(1, -1);
        ctx.drawImage(GL.canvas, x * k - src / 2, sy + y * k - src / 2, src, src, -R, -ry, R * 2, ry * 2);
        ctx.setTransform(k, 0, 0, k, 0, 0);
      }
      // Объём: тёмный ободок, сильнее снизу
      let g = ctx.createRadialGradient(x, y - ry * 0.25, R * 0.35, x, y, Math.max(R, ry));
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,0.38)');
      ctx.fillStyle = g;
      ctx.fillRect(x - R, y - ry, R * 2, ry * 2);
      ctx.restore();

      // Блик сверху-слева и светлая кромка снизу (свет проходит сквозь каплю)
      const hl = lerp(0.45, 0.85, day) * a;
      ctx.fillStyle = `rgba(255,255,255,${hl})`;
      ctx.beginPath();
      ctx.ellipse(x - R * 0.35, y - ry * 0.42, R * 0.22, R * 0.16, -0.5, 0, 6.283);
      ctx.fill();
      if (R > 1.5) {
        ctx.strokeStyle = `rgba(255,255,255,${hl * 0.35})`;
        ctx.lineWidth = Math.max(0.5, R * 0.12);
        ctx.beginPath();
        ctx.ellipse(x, y, R * 0.78, ry * 0.8, 0, 0.4, 2.7);
        ctx.stroke();
      }
    }
  }
}

// ---------- Разметка часов ----------
const skies = [];
const io = new IntersectionObserver((entries) => {
  for (const e of entries) e.target._sky.visible = e.isIntersecting;
});
function makeClock(host, k) {
  host.innerHTML = `
    <div class="clock" style="--k:${k}">
      <canvas></canvas>
      <div class="face">
        <span class="label" data-temp>—°C</span>
        <span class="time"><span data-h>00</span><span data-m>00</span></span>
        <span class="label">MSK</span>
      </div>
    </div>`;
  const el = host.firstElementChild;
  const sky = new Sky(el.querySelector('canvas'));
  skies.push(sky);
  el._sky = sky;
  io.observe(el);
  return {
    sky,
    setText(hh, mm, temp) {
      el.querySelector('[data-h]').textContent = hh;
      el.querySelector('[data-m]').textContent = mm;
      el.querySelector('[data-temp]').textContent = temp;
    },
  };
}

const heroes = [makeClock(document.getElementById('heroSmall'), 1), makeClock(document.getElementById('heroBig'), 2)];

// Витрина сцен с подобранным временем суток
const presets = [
  ['clear', 12.5, 'Ясно, день'],
  ['partly', hourAtAltitude(1, true), 'Закат'],
  ['clear', 23.5, 'Ясная ночь'],
  ['fog', hourAtAltitude(1, false), 'Туман на рассвете'],
  ['partly', 11, 'Облачно'],
  ['cloudy', 13, 'Пасмурно'],
  ['drizzle', 14, 'Морось'],
  ['rain', hourAtAltitude(-3, true), 'Дождь вечером'],
  ['thunder', 15, 'Гроза'],
  ['snow', 10.5, 'Снег'],
  ['snow', 21, 'Снег ночью'],
  ['fog', 22, 'Туман ночью'],
];
function addPreview(strip, key, hour, label, opts = {}) {
  const fig = document.createElement('figure');
  const host = document.createElement('div');
  fig.append(host);
  fig.insertAdjacentHTML('beforeend', `<figcaption>${label}<br>${opts.sub ?? fmtHour(hour).join(':')}</figcaption>`);
  strip.append(fig);
  const c = makeClock(host, 1);
  const s = sun(mskDate(hour));
  c.sky.set({ ...SCENES[key], wind: key === 'thunder' ? 0.7 : 0.3, alt: s.alt, sunX: s.x }, true);
  if (opts.moon != null) c.sky.moonPhase = opts.moon;
  if (opts.glass) { c.sky.glass = true; c.sky.prefillGlass(opts.glass); }
  const [hh, mm] = fmtHour(hour);
  c.setText(hh, mm, fmtTemp(SCENES[key].temp));
}

const strip = document.getElementById('strip');
for (const [key, hour, label] of presets) addPreview(strip, key, hour, label);

const glassStrip = document.getElementById('glassStrip');
addPreview(glassStrip, 'drizzle', 13, 'Морось', { glass: 12 });
addPreview(glassStrip, 'rain', 14, 'Дождь днём', { glass: 22 });
addPreview(glassStrip, 'rain', hourAtAltitude(1, true), 'Дождь на закате', { glass: 22 });
addPreview(glassStrip, 'rain', 22, 'Дождь ночью', { glass: 22 });
addPreview(glassStrip, 'thunder', 16, 'Гроза', { glass: 28 });

const moonStrip = document.getElementById('moonStrip');
for (const p of [0.08, 0.18, 0.25, 0.37, 0.5, 0.63, 0.75, 0.86, 0.94]) {
  addPreview(moonStrip, 'clear', 23.5, moonName(p), { moon: p, sub: `${Math.round((0.5 - 0.5 * Math.cos(2 * Math.PI * p)) * 100)}% диска` });
}

// ---------- Управление ----------
const state = { source: 'live', scene: 'clear', hour: 12, wind: 0.3, moon: moonPhase(new Date()), live: null, error: null };

const sceneBox = document.getElementById('scenes');
for (const [key, s] of Object.entries(SCENES)) {
  sceneBox.insertAdjacentHTML('beforeend', `<button data-v="${key}" aria-pressed="false">${s.label}</button>`);
}
const pressOnly = (box, v) => box.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
const hourIn = document.getElementById('hour');
const windIn = document.getElementById('wind');

document.getElementById('source').addEventListener('click', (e) => {
  const v = e.target.closest('button')?.dataset.v;
  if (!v) return;
  if (v === 'manual' && state.source === 'live') {
    // Ручной режим стартует с того, что сейчас на экране
    state.hour = mskNowHour();
    if (state.live) { state.scene = state.live.scene.key; state.wind = state.live.wind; }
    hourIn.value = state.hour; windIn.value = state.wind;
  }
  state.source = v;
  update();
});
sceneBox.addEventListener('click', (e) => {
  const v = e.target.closest('button')?.dataset.v;
  if (v) { state.scene = v; update(); }
});
hourIn.addEventListener('input', () => { state.hour = +hourIn.value; update(); });
windIn.addEventListener('input', () => { state.wind = +windIn.value; update(); });
const moonIn = document.getElementById('moon');
moonIn.value = state.moon;
moonIn.addEventListener('input', () => { state.moon = +moonIn.value; update(); });
const glassIn = document.getElementById('glass');
glassIn.addEventListener('change', update);

const motionIn = document.getElementById('motion');
motionIn.checked = !matchMedia('(prefers-reduced-motion: reduce)').matches;

function update() {
  pressOnly(document.getElementById('source'), state.source);
  document.getElementById('manual').setAttribute('aria-disabled', String(state.source === 'live'));
  pressOnly(sceneBox, state.scene);

  let scene, hour, wind, temp;
  if (state.source === 'live') {
    hour = mskNowHour();
    scene = state.live ? state.live.scene : SCENES.clear;
    wind = state.live ? state.live.wind : 0.3;
    temp = state.live ? state.live.temp : null;
  } else {
    hour = state.hour;
    scene = SCENES[state.scene];
    wind = state.wind;
    temp = scene.temp;
  }
  const s = sun(state.source === 'live' ? new Date() : mskDate(hour));
  const [hh, mm] = fmtHour(hour);
  const moon = state.source === 'live' ? moonPhase(new Date()) : state.moon;
  for (const h of heroes) {
    h.sky.set({ ...scene, wind, alt: s.alt, sunX: s.x });
    h.sky.moonPhase = moon;
    h.sky.glass = glassIn.checked;
    if (!glassIn.checked) h.sky.glassDrops = [];
    h.setText(hh, mm, fmtTemp(temp));
  }
  document.getElementById('moonOut').textContent = moonName(state.moon);
  document.getElementById('hourOut').textContent = fmtHour(state.hour).join(':');
  document.getElementById('windOut').textContent = `${Math.round(state.wind * 40)} км/ч`;

  const lines = [];
  if (state.source === 'live') {
    if (state.error) lines.push(`Open-Meteo недоступен: ${state.error}`, 'показываю ясное небо');
    else if (state.live) {
      const L = state.live;
      lines.push(`WMO ${L.code} → ${L.scene.label}`, `облачность ${L.cloud}%`, `ветер ${L.windKmh} км/ч`, `is_day ${L.isDay}`);
    } else lines.push('Загружаю погоду…');
  } else lines.push(`сцена: ${scene.label}`);
  lines.push(`солнце ${s.alt >= 0 ? '+' : '−'}${Math.abs(s.alt).toFixed(1)}°`);
  lines.push(`луна: ${moonName(moon).toLowerCase()}, ${Math.round((0.5 - 0.5 * Math.cos(2 * Math.PI * moon)) * 100)}%`);
  document.getElementById('readout').textContent = lines.join('\n');
}

async function loadLive() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
      `&current=temperature_2m,weather_code,cloud_cover,is_day,wind_speed_10m&timezone=auto`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const c = (await res.json()).current;
    state.live = {
      code: c.weather_code, cloud: c.cloud_cover, isDay: c.is_day, temp: c.temperature_2m,
      windKmh: Math.round(c.wind_speed_10m), wind: clamp(c.wind_speed_10m / 40),
      scene: sceneFromWMO(c.weather_code, c.cloud_cover),
    };
    state.error = null;
  } catch (err) {
    state.error = err.message;
  }
  update();
}

update();
for (const h of heroes) h.sky.cur = { ...h.sky.target };
loadLive();
setInterval(loadLive, 15 * 60 * 1000);
setInterval(() => state.source === 'live' && update(), 20 * 1000);

// ---------- Цикл ----------
let last = performance.now();
function frame(now) {
  const animate = motionIn.checked;
  const dt = animate ? Math.min(0.05, (now - last) / 1000) : 0;
  last = now;
  for (const s of skies) {
    if (!s.visible) continue;
    s.step(animate ? dt : 1);
    s.draw(now / 1000, dt);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
